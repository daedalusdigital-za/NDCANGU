<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6 4">
  <!-- Red top stripe -->
  <rect x="0" y="0" width="6" height="0.8" fill="#DE3831"/>
  
  <!-- Blue bottom stripe -->
  <rect x="0" y="3.2" width="6" height="0.8" fill="#002395"/>
  
  <!-- White stripes -->
  <rect x="2.4" y="0.8" width="3.6" height="0.4" fill="#FFFFFF"/>
  <rect x="2.4" y="2.8" width="3.6" height="0.4" fill="#FFFFFF"/>
  
  <!-- Green center stripe -->
  <rect x="2.4" y="1.6" width="3.6" height="0.8" fill="#007A4D"/>
  
  <!-- Green triangle (left side) -->
  <polygon points="0,0 0,4 2.4,2" fill="#007A4D"/>
  
  <!-- Gold/Yellow Y-shape pall -->
  <polygon points="0,0 0,0.8 1.6,1.6 2.4,1.2 2.4,0.8 1.2,0" fill="#FFB612"/>
  <polygon points="0,4 0,3.2 1.6,2.4 2.4,2.8 2.4,3.2 1.2,4" fill="#FFB612"/>
  
  <!-- Black Y-shape pall (inner) -->
  <polygon points="1.2,0 1.6,0.4 2.4,1.2 2.4,0.8 1.6,0" fill="#000000"/>
  <polygon points="1.2,4 1.6,3.6 2.4,2.8 2.4,3.2 1.6,4" fill="#000000"/>
  
  <!-- White Y-shape pall (inner outline) -->
  <polygon points="1.6,0 1.8,0.2 2.4,1.2 2.4,0.8 2,0" fill="#FFFFFF"/>
  <polygon points="1.6,4 1.8,3.8 2.4,2.8 2.4,3.2 2,4" fill="#FFFFFF"/>
  
  <!-- Black center line -->
  <rect x="2.4" y="1.8" width="0.4" height="0.4" fill="#000000"/>
</svg>
