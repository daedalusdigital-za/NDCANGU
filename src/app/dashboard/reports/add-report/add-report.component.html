<div class="add-report-container">
  <div class="card">
    <div class="card-header">
      <h3>Add New Report</h3>
    </div>
    <div class="card-body">
      <form (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="reportTitle">Report Title</label>
              <input type="text" class="form-control" id="reportTitle" placeholder="Enter report title">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="reportType">Report Type</label>
              <select class="form-control" id="reportType">
                <option value="">Select report type</option>
                <option value="medical">Medical Report</option>
                <option value="training">Training Report</option>
                <option value="inventory">Inventory Report</option>
                <option value="sales">Sales Report</option>
              </select>
            </div>
          </div>
        </div>
        
        <div class="form-group">
          <label for="reportDescription">Description</label>
          <textarea class="form-control" id="reportDescription" rows="4" placeholder="Enter report description"></textarea>
        </div>
        
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Create Report</button>
          <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
