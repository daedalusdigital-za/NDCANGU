<div class="modal fade" [class.show]="isVisible" [style.display]="isVisible ? 'block' : 'none'" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bx bx-lock-alt me-2"></i>Change Password
                </h5>
                <button type="button" class="btn-close" (click)="closeModal()" [disabled]="isLoading"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <p class="text-muted">Changing password for: <strong>{{ userName }}</strong></p>
                </div>

                <form #passwordForm="ngForm">
                    <!-- New Password -->
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input
                                [type]="showNewPassword ? 'text' : 'password'"
                                class="form-control"
                                id="newPassword"
                                name="newPassword"
                                [(ngModel)]="newPassword"
                                required
                                minlength="8"
                                placeholder="Enter new password (min 8 characters)"
                                [disabled]="isLoading">
                            <button
                                class="btn btn-outline-secondary"
                                type="button"
                                (click)="togglePasswordVisibility('new')"
                                [disabled]="isLoading">
                                <i class="bx" [ngClass]="showNewPassword ? 'bx-hide' : 'bx-show'"></i>
                            </button>
                        </div>
                        <small class="text-muted">Password must be at least 8 characters long</small>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm New Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input
                                [type]="showConfirmPassword ? 'text' : 'password'"
                                class="form-control"
                                id="confirmPassword"
                                name="confirmPassword"
                                [(ngModel)]="confirmPassword"
                                required
                                placeholder="Re-enter new password"
                                [disabled]="isLoading"
                                [class.is-invalid]="confirmPassword && newPassword !== confirmPassword">
                            <button
                                class="btn btn-outline-secondary"
                                type="button"
                                (click)="togglePasswordVisibility('confirm')"
                                [disabled]="isLoading">
                                <i class="bx" [ngClass]="showConfirmPassword ? 'bx-hide' : 'bx-show'"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback" *ngIf="confirmPassword && newPassword !== confirmPassword">
                            Passwords do not match
                        </div>
                    </div>
                </form>

                <div class="alert alert-info mt-3">
                    <i class="bx bx-info-circle me-2"></i>
                    <strong>Password Requirements:</strong>
                    <ul class="mb-0 mt-2">
                        <li>Minimum 8 characters</li>
                        <li>Use a strong, unique password</li>
                    </ul>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="closeModal()" [disabled]="isLoading">
                    Cancel
                </button>
                <button
                    type="button"
                    class="btn btn-primary"
                    (click)="changePassword()"
                    [disabled]="isLoading || !newPassword || !confirmPassword || newPassword !== confirmPassword">
                    <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    {{ isLoading ? 'Changing...' : 'Change Password' }}
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Backdrop -->
<div class="modal-backdrop fade" [class.show]="isVisible" *ngIf="isVisible"></div>
