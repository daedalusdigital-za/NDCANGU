<div class="modal" [class.show]="isVisible" [style.display]="isVisible ? 'block' : 'none'" tabindex="-1">
  <div class="modal-backdrop" [class.show]="isVisible" (click)="closeModal()"></div>
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Sale</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>

      <div class="modal-body">
        <div *ngIf="isLoading" class="text-center py-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <form #saleForm="ngForm" (ngSubmit)="onSubmit(saleForm)" *ngIf="!isLoading">
          <div class="row">
            <!-- Sale Number -->
            <div class="col-md-6 mb-3">
              <label for="saleNumber" class="form-label">Sale Number</label>
              <input
                type="text"
                class="form-control"
                id="saleNumber"
                name="saleNumber"
                [(ngModel)]="sale.saleNumber"
                required
                [class.is-invalid]="saleForm.submitted && saleForm.controls['saleNumber']?.invalid">
              <div class="invalid-feedback">Sale number is required</div>
            </div>

            <!-- Sale Date -->
            <div class="col-md-6 mb-3">
              <label for="saleDate" class="form-label">Sale Date</label>
              <input
                type="date"
                class="form-control"
                id="saleDate"
                name="saleDate"
                [(ngModel)]="sale.saleDate"
                required
                [class.is-invalid]="saleForm.submitted && saleForm.controls['saleDate']?.invalid">
              <div class="invalid-feedback">Sale date is required</div>
            </div>

            <!-- Customer Name -->
            <div class="col-md-6 mb-3">
              <label for="customerName" class="form-label">Customer Name</label>
              <input
                type="text"
                class="form-control"
                id="customerName"
                name="customerName"
                [(ngModel)]="sale.customerName"
                required
                [class.is-invalid]="saleForm.submitted && saleForm.controls['customerName']?.invalid">
              <div class="invalid-feedback">Customer name is required</div>
            </div>

            <!-- Customer Phone -->
            <div class="col-md-6 mb-3">
              <label for="customerPhone" class="form-label">Customer Phone</label>
              <input
                type="tel"
                class="form-control"
                id="customerPhone"
                name="customerPhone"
                [(ngModel)]="sale.customerPhone"
                required
                [class.is-invalid]="saleForm.submitted && saleForm.controls['customerPhone']?.invalid">
              <div class="invalid-feedback">Customer phone is required</div>
            </div>

            <!-- Province -->
            <div class="col-md-6 mb-3">
              <label for="provinceId" class="form-label">Province</label>
              <select
                class="form-select"
                id="provinceId"
                name="provinceId"
                [(ngModel)]="sale.provinceId"
                required
                [class.is-invalid]="saleForm.submitted && saleForm.controls['provinceId']?.invalid">
                <option value="">Select Province</option>
                <option *ngFor="let province of provinces" [value]="province.id">{{province.name}}</option>
              </select>
              <div class="invalid-feedback">Province is required</div>
            </div>

            <!-- Subtotal -->
            <div class="col-md-6 mb-3">
              <label for="subtotal" class="form-label">Subtotal (ZAR)</label>
              <input
                type="number"
                class="form-control"
                id="subtotal"
                name="subtotal"
                [(ngModel)]="sale.subtotal"
                required
                min="0"
                step="0.01"
                [class.is-invalid]="saleForm.submitted && saleForm.controls['subtotal']?.invalid">
              <div class="invalid-feedback">Subtotal is required</div>
            </div>

            <!-- Total -->
            <div class="col-md-6 mb-3">
              <label for="total" class="form-label">Total Amount (ZAR)</label>
              <input
                type="number"
                class="form-control"
                id="total"
                name="total"
                [(ngModel)]="sale.total"
                required
                min="0"
                step="0.01"
                [class.is-invalid]="saleForm.submitted && saleForm.controls['total']?.invalid">
              <div class="invalid-feedback">Total amount is required</div>
            </div>

            <!-- Customer ID (Optional) -->
            <div class="col-md-6 mb-3">
              <label for="customerId" class="form-label">Customer ID (Optional)</label>
              <input
                type="number"
                class="form-control"
                id="customerId"
                name="customerId"
                [(ngModel)]="sale.customerId"
                min="1">
            </div>

            <!-- Notes -->
            <div class="col-md-12 mb-3">
              <label for="notes" class="form-label">Notes</label>
              <textarea
                class="form-control"
                id="notes"
                name="notes"
                rows="3"
                [(ngModel)]="sale.notes"
                placeholder="Additional notes about this sale..."></textarea>
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeModal()" [disabled]="isLoading">
          Cancel
        </button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="onSubmit(saleForm)"
          [disabled]="isLoading || saleForm.invalid">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          Save Changes
        </button>
      </div>
    </div>
  </div>
</div>
