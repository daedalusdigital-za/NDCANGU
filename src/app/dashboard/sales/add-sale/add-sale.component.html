<div class="page-content">
    <div class="container-fluid">
        <!-- Page Title -->
        <div class="row">
            <div class="col-12">
                <div class="page-title-box d-sm-flex align-items-center justify-content-between">
                    <h4 class="mb-sm-0 font-size-18">Add New Sale</h4>
                    <div class="page-title-right">
                        <ol class="breadcrumb m-0">
                            <li class="breadcrumb-item"><a href="javascript: void(0);">Sales</a></li>
                            <li class="breadcrumb-item active">Add Sale</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>

        <form #saleForm="ngForm" (ngSubmit)="saveSale()">
            <!-- Customer Information -->
            <div class="row">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Customer Information</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Customer Name *</label>
                                        <input type="text" 
                                               class="form-control" 
                                               [(ngModel)]="sale.customerName" 
                                               name="customerName" 
                                               required 
                                               placeholder="Enter customer name">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Customer Phone *</label>
                                        <input type="tel" 
                                               class="form-control" 
                                               [(ngModel)]="sale.customerPhone" 
                                               name="customerPhone" 
                                               required 
                                               placeholder="Enter customer phone">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Customer Email</label>
                                        <input type="email" 
                                               class="form-control" 
                                               [(ngModel)]="sale.customerEmail" 
                                               name="customerEmail" 
                                               placeholder="Enter customer email">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Customer Address</label>
                                        <input type="text" 
                                               class="form-control" 
                                               [(ngModel)]="sale.customerAddress" 
                                               name="customerAddress" 
                                               placeholder="Enter customer address">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Province *</label>
                                        <select class="form-select" 
                                                [(ngModel)]="sale.province" 
                                                name="province" 
                                                required 
                                                (change)="onProvinceChange()">
                                            <option value="">Select Province</option>
                                            <option *ngFor="let province of provinces" [value]="province.code">
                                                {{province.name}}
                                            </option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Hospital/Clinic</label>
                                        <select class="form-select" 
                                                [(ngModel)]="sale.hospital" 
                                                name="hospital" 
                                                [disabled]="filteredHospitals.length === 0">
                                            <option value="">Select Hospital</option>
                                            <option *ngFor="let hospital of filteredHospitals" [value]="hospital.code">
                                                {{hospital.name}}
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Sale Date</label>
                                        <input type="date" 
                                               class="form-control" 
                                               [(ngModel)]="sale.saleDate" 
                                               name="saleDate">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Notes</label>
                                        <textarea class="form-control" 
                                                  [(ngModel)]="sale.notes" 
                                                  name="notes" 
                                                  rows="2" 
                                                  placeholder="Additional notes"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Sale Summary -->
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Sale Summary</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Total Quantity</label>
                                <input type="number" 
                                       class="form-control" 
                                       [value]="sale.totalQuantity" 
                                       readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select class="form-select" [(ngModel)]="sale.status" name="status">
                                    <option value="Pending">Pending</option>
                                    <option value="Completed">Completed</option>
                                    <option value="Cancelled">Cancelled</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Total Amount</label>
                                <div class="input-group">
                                    <span class="input-group-text">R</span>
                                    <input type="number" 
                                           class="form-control" 
                                           [value]="sale.totalAmount" 
                                           readonly>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Add Products Section -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Add Products</h5>
                        </div>
                        <div class="card-body">
                            <div class="row align-items-end">
                                <div class="col-md-5">
                                    <div class="mb-3">
                                        <label class="form-label">Select Product</label>
                                        <select class="form-select" [(ngModel)]="selectedProduct" name="selectedProduct">
                                            <option [ngValue]="null">Select a product</option>
                                            <option *ngFor="let product of products" [ngValue]="product">
                                                {{product.name}} - R{{product.price}} (Stock: {{product.stock}})
                                            </option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="mb-3">
                                        <label class="form-label">Quantity</label>
                                        <input type="number" 
                                               class="form-control" 
                                               [(ngModel)]="quantity" 
                                               name="quantity" 
                                               min="1" 
                                               [max]="selectedProduct?.stock || 100">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <button type="button" 
                                                class="btn btn-primary" 
                                                (click)="addProductToSale()" 
                                                [disabled]="!selectedProduct || quantity <= 0">
                                            <i class="dripicons-plus me-2"></i>Add Product
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Products in Sale -->
            <div class="row" *ngIf="sale.products.length > 0">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Products in Sale</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>Product</th>
                                            <th>Price</th>
                                            <th>Quantity</th>
                                            <th>Subtotal</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let product of sale.products">
                                            <td>{{product.name}}</td>
                                            <td>R{{product.price}}</td>
                                            <td>{{product.quantity}}</td>
                                            <td>R{{product.subtotal}}</td>
                                            <td>
                                                <button type="button" 
                                                        class="btn btn-sm btn-danger" 
                                                        (click)="removeProductFromSale(product.id)">
                                                    <i class="dripicons-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                    <tfoot>
                                        <tr>
                                            <th colspan="3">Total:</th>
                                            <th>R{{sale.totalAmount}}</th>
                                            <th></th>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Notes -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Additional Notes</h5>
                        </div>
                        <div class="card-body">
                            <textarea class="form-control" 
                                      [(ngModel)]="sale.notes" 
                                      name="notes" 
                                      rows="3" 
                                      placeholder="Enter any additional notes about this sale..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-end gap-3">
                                <button type="button" 
                                        class="btn btn-secondary" 
                                        (click)="resetForm()">
                                    <i class="dripicons-refresh me-2"></i>Reset
                                </button>
                                <button type="button" 
                                        class="btn btn-outline-primary" 
                                        routerLink="/dashboard/sales">
                                    <i class="dripicons-arrow-left me-2"></i>Back to Sales
                                </button>
                                <button type="submit" 
                                        class="btn btn-primary"
                                        [disabled]="!saleForm.valid || sale.products.length === 0">
                                    <i class="dripicons-checkmark me-2"></i>Save Sale
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
