<div class="auth-content my-auto">
    <!-- Modern Welcome Section -->
    <div class="text-center mb-5">
        <div class="welcome-header">
            <h2 class="welcome-title">Welcome Back</h2>
            <p class="welcome-subtitle">Sign in to continue to The NCD Health App</p>
        </div>
    </div>

    <!-- Modern Login Form -->
    <form #form="ngForm" ngNativeValidate class="modern-form" (ngSubmit)="form.valid && loginUser()">
        <!-- Email Input -->
        <div class="form-group">
            <div class="input-wrapper">
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <input 
                    type="email" 
                    required="true" 
                    class="form-control modern-input" 
                    name="email" 
                    [(ngModel)]="user.email"
                    placeholder="Enter your email address"
                    [class.has-value]="user.email">
                <label class="floating-label">Email Address</label>
            </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
            <div class="input-wrapper">
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <input 
                    [type]="isPasswordHidden ? 'password' : 'text'" 
                    required="true" 
                    class="form-control modern-input" 
                    name="password" 
                    [(ngModel)]="user.password"
                    placeholder="Enter your password"
                    [class.has-value]="user.password">
                <label class="floating-label">Password</label>
                <button 
                    type="button" 
                    class="password-toggle" 
                    (click)="isPasswordHidden = !isPasswordHidden"
                    [title]="isPasswordHidden ? 'Show password' : 'Hide password'">
                    <i [class]="isPasswordHidden ? 'fas fa-eye' : 'fas fa-eye-slash'"></i>
                </button>
            </div>
        </div>

        <!-- Forgot Password -->
        <div class="form-options">
            <div class="forgot-password">
                <a (click)="openForgotPasswordModal()" class="forgot-link">Forgot Password?</a>
            </div>
        </div>

        <!-- Terms Agreement -->
        <div class="terms-agreement">
            <input type="checkbox" class="modern-checkbox" id="termsAccept" required>
            <label for="termsAccept" class="checkbox-label">
                I agree to the <a (click)="openTermsModal()" class="terms-link">Terms of Service</a> and <a (click)="openPrivacyPolicyModal()" class="terms-link">Privacy Policy</a>
            </label>
            <div class="invalid-feedback">
                Please accept the terms before proceeding.
            </div>
        </div>

        <!-- Login Button -->
        <div class="login-button-wrapper">
            <button 
                type="submit" 
                class="btn modern-login-btn" 
                [disabled]="isLoading"
                [class.loading]="isLoading">
                <span class="button-content" *ngIf="!isLoading">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </span>
                <span class="button-content" *ngIf="isLoading">
                    <i class="fas fa-spinner fa-spin"></i>
                    Signing In...
                </span>
            </button>
        </div>

        <!-- Divider -->
        <div class="divider">
            <span class="divider-text">or</span>
        </div>

        <!-- Social Login (Optional) -->
        <div class="social-login">
            <button type="button" class="btn social-btn google-btn">
                <i class="fab fa-google"></i>
                Continue with Google
            </button>
            <button type="button" class="btn social-btn microsoft-btn">
                <i class="fab fa-microsoft"></i>
                Continue with Microsoft
            </button>
        </div>

        <!-- Register Link -->
        <div class="register-link">
            <p class="register-text">
                Don't have an account? 
                <a class="register-link-text" routerLink="/auth/register">Create Account</a>
            </p>
        </div>
    </form>
</div>

<!-- Forgot Password Modal -->
<div class="modal-overlay" *ngIf="showForgotPasswordModal" (click)="closeForgotPasswordModal()">
    <div class="forgot-password-modal" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h3 class="modal-title">Reset Password</h3>
            <button type="button" class="modal-close" (click)="closeForgotPasswordModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="modal-body">
            <p class="modal-description">
                Enter your email address and we'll send you instructions to reset your password.
            </p>
            
            <div class="form-group">
                <div class="input-wrapper">
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <input 
                        type="email" 
                        class="form-control modern-input" 
                        [(ngModel)]="forgotPasswordEmail"
                        placeholder="Enter your email address"
                        [class.has-value]="forgotPasswordEmail">
                    <label class="floating-label">Email Address</label>
                </div>
            </div>
        </div>
        
        <div class="modal-footer">
            <button 
                type="button" 
                class="btn btn-secondary" 
                (click)="closeForgotPasswordModal()"
                [disabled]="isForgotPasswordLoading">
                Cancel
            </button>
            <button 
                type="button" 
                class="btn modern-login-btn" 
                (click)="submitForgotPassword()"
                [disabled]="isForgotPasswordLoading">
                <span *ngIf="!isForgotPasswordLoading">
                    <i class="fas fa-paper-plane"></i>
                    Send Reset Link
                </span>
                <span *ngIf="isForgotPasswordLoading">
                    <i class="fas fa-spinner fa-spin"></i>
                    Sending...
                </span>
            </button>
        </div>
    </div>
</div>
