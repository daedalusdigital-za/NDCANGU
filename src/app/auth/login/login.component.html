<div class="auth-content my-auto">
    <!-- Modern Welcome Section -->
    <div class="text-center mb-5">
        <div class="welcome-header">
            <h2 class="welcome-title">Welcome Back</h2>
            <p class="welcome-subtitle">Sign in to continue to The NCD Health App</p>
        </div>
    </div>

    <!-- Modern Login Form -->
    <form #form="ngForm" ngNativeValidate class="modern-form" (ngSubmit)="form.valid && loginUser()">
        <!-- Email Input -->
        <div class="form-group">
            <div class="input-wrapper">
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <input
                    type="email"
                    required="true"
                    class="form-control modern-input"
                    name="email"
                    [(ngModel)]="user.email"
                    placeholder="Enter your email address"
                    [class.has-value]="user.email">
                <label class="floating-label">Email Address</label>
            </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
            <div class="input-wrapper">
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <input
                    [type]="isPasswordHidden ? 'password' : 'text'"
                    required="true"
                    class="form-control modern-input"
                    name="password"
                    [(ngModel)]="user.password"
                    placeholder="Enter your password"
                    [class.has-value]="user.password">
                <label class="floating-label">Password</label>
                <button
                    type="button"
                    class="password-toggle"
                    (click)="isPasswordHidden = !isPasswordHidden"
                    [title]="isPasswordHidden ? 'Show password' : 'Hide password'">
                    <i [class]="isPasswordHidden ? 'fas fa-eye' : 'fas fa-eye-slash'"></i>
                </button>
            </div>
        </div>

        <!-- Forgot Password -->
        <div class="form-options">
            <div class="forgot-password">

            </div>
        </div>



        <!-- Login Button -->
        <div class="login-button-wrapper">
            <button
                type="submit"
                class="btn modern-login-btn"
                [disabled]="isLoading"
                [class.loading]="isLoading">
                <span class="button-content" *ngIf="!isLoading">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </span>
                <span class="button-content" *ngIf="isLoading">
                    <i class="fas fa-spinner fa-spin"></i>
                    Signing In...
                </span>
            </button>
        </div>

        <!-- Divider -->
        <div class="divider">
            <span class="divider-text">or</span>
        </div>

        <!-- Social Login (Optional) -->
        <div class="social-login">
            <button type="button" class="btn social-btn microsoft-btn">
                <i class="fab fa-microsoft"></i>
                Continue with Microsoft
            </button>
        </div>

        <!-- Contact Admin Link -->
        <div class="register-link">
            <p class="register-text">
                Don't have an account?
                <a class="register-link-text" (click)="openContactAdminModal()">Contact Admin</a>
            </p>
        </div>
    </form>
</div>

<!-- Contact Admin Modal -->
<div class="modal-overlay" *ngIf="showContactAdminModal" (click)="closeContactAdminModal()">
    <div class="forgot-password-modal" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h3 class="modal-title">
                <i class="fas fa-user-shield"></i>
                Contact Admin
            </h3>
            <button type="button" class="modal-close" (click)="closeContactAdminModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="modal-body">
            <p class="modal-description">
                To create an account, please contact one of our administrators:
            </p>

            <div class="admin-contacts">
                <div class="contact-item">
                    <div class="contact-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="contact-details">
                        <a href="mailto:Welcome@promedtechnologies.co.za" class="contact-email">
                            Welcome@promedtechnologies.co.za
                        </a>
                    </div>
                </div>

                <div class="contact-item">
                    <div class="contact-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="contact-details">
                        <a href="mailto:IT@promedtechnologies.co.za" class="contact-email">
                            IT@promedtechnologies.co.za
                        </a>
                    </div>
                </div>
            </div>

            <div class="contact-note">
                <i class="fas fa-info-circle"></i>
                <p>Our team will assist you with account creation and setup.</p>
            </div>
        </div>

        <div class="modal-footer">
            <button
                type="button"
                class="btn modern-login-btn"
                (click)="closeContactAdminModal()">
                <i class="fas fa-check"></i>
                Got It
            </button>
        </div>
    </div>
</div>
